    parameters: {angle_degrees: 45.0}
    transform: {kind: identity}
  - id: validation-rlinear-m3-a60
    name: rlinear
    n_obj: 3
    n_var: 12
    parameters: {angle_degrees: 60.0}
    transform: {kind: identity}
algorithms:
  - id: hldbea
    variant: full
    parameters:
      k: 1.0
      lambda: 0.1
      cone_epsilon: 0.0
      neighborhood_mode: axis
      score_aggregation: sum
      selection_mode: local
      objective_policy: round_robin
      tau: 1
      local_search_max_iter: 2
      local_search_acceptance: feasible_improvement
      restart: true
      restart_theta_zero: 0.95
      restart_window: 20
      restart_delta_hv: 0.0001
      restart_fraction: 0.2
      crossover_probability: 0.9
      crossover_eta: 20
      mutation_probability: inverse_n_var
      mutation_eta: 20
      mutation_scope: per_variable
  - &standard
    id: nsga2
    variant: standard
    parameters: &standard_parameters
      crossover_probability: 0.9
      crossover_eta: 20
      mutation_probability: inverse_n_var
      mutation_eta: 20
      mutation_scope: per_variable
  - <<: *standard
    id: nsga3
execution:
  population_size: 100
  evaluation_budget: 10000
  checkpoints: [100, 1000, 5000, 10000]
  save_history: false
