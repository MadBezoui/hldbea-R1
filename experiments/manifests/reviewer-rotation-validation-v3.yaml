problems:
  - id: validation-rlinear-m3-a0
    name: rlinear
    n_obj: 3
    n_var: 12
    parameters: {angle_degrees: 0.0}
    transform: {kind: identity}
  - id: validation-rlinear-m3-a15
    name: rlinear
    n_obj: 3
    n_var: 12
    parameters: {angle_degrees: 15.0}
    transform: {kind: identity}
  - id: validation-rlinear-m3-a30
    name: rlinear
    n_obj: 3
    n_var: 12
    parameters: {angle_degrees: 30.0}
    transform: {kind: identity}
  - id: validation-rlinear-m3-a45
    name: rlinear
    n_obj: 3
