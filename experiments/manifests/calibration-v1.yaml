schema_version: 1
manifest_id: calibration-v1
stage: calibration

# Calibration seeds are disjoint from the reserved validation range
# 51001--51030 documented in docs/experiment-harness-report.md.
seeds:
  - 41001
  - 41002
  - 41003
  - 41004
  - 41005

# DTLZ1 and WFG1 are calibration-only. The frozen validation design reserves
# DTLZ2/3/4 and WFG2/3/9, including rotated cases.
problems:
  - id: calibration-dtlz1-m3
    name: dtlz1
    n_obj: 3
    n_var: 7
    parameters: {}
    transform:
      kind: identity
  - id: calibration-wfg1-m5
    name: wfg1
    n_obj: 5
    n_var: 24
    parameters: {}
    transform:
      kind: identity

# One-factor-at-a-time grid limited to reviewer-relevant neighborhood,
# cone-relaxation, local-search depth and restart sensitivity parameters.
algorithms:
  - id: hldbea
    variant: baseline
    parameters: &baseline
      k: 1.0
      lambda: 0.1
      cone_epsilon: 0.0
      selection_mode: local
      objective_policy: round_robin
      tau: 1
      local_search_max_iter: 2
      restart: true
      restart_theta_zero: 0.95
      restart_window: 20
      restart_delta_hv: 0.0001
      restart_fraction: 0.2
      crossover_probability: 0.9
      crossover_eta: 20
      mutation_probability: inverse_n_var
      mutation_eta: 20
  - id: hldbea
    variant: k-0p5
    parameters:
      <<: *baseline
      k: 0.5
  - id: hldbea
    variant: k-2p0
    parameters:
      <<: *baseline
      k: 2.0
  - id: hldbea
    variant: cone-0p05
    parameters:
      <<: *baseline
      cone_epsilon: 0.05
  - id: hldbea
    variant: cone-0p10
    parameters:
      <<: *baseline
      cone_epsilon: 0.10
  - id: hldbea
    variant: ls-iter-1
    parameters:
      <<: *baseline
      local_search_max_iter: 1
  - id: hldbea
    variant: ls-iter-5
    parameters:
      <<: *baseline
      local_search_max_iter: 5
  - id: hldbea
    variant: restart-window-10
    parameters:
      <<: *baseline
      restart_window: 10
  - id: hldbea
    variant: restart-window-40
    parameters:
      <<: *baseline
      restart_window: 40
  - id: hldbea
    variant: restart-delta-1e5
    parameters:
      <<: *baseline
      restart_delta_hv: 0.00001
  - id: hldbea
    variant: restart-delta-1e3
    parameters:
      <<: *baseline
      restart_delta_hv: 0.001

execution:
  population_size: 100
  evaluation_budget: 10000
  checkpoints:
    - 100
    - 500
    - 1000
    - 2000
    - 5000
    - 10000
  save_history: false
