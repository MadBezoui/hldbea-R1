schema_version: 1
manifest_id: reviewer-modern-benchmarks-validation-v2
stage: validation
seeds: &validation_seeds
  - 51001
  - 51002
  - 51003
  - 51004
  - 51005
  - 51006
  - 51007
  - 51008
  - 51009
  - 51010
  - 51011
  - 51012
  - 51013
  - 51014
  - 51015
  - 51016
  - 51017
  - 51018
  - 51019
  - 51020
  - 51021
  - 51022
  - 51023
  - 51024
  - 51025
  - 51026
  - 51027
  - 51028
  - 51029
  - 51030
problems:
  - id: validation-imop3-m2
    name: imop3
    n_obj: 2
    n_var: 10
    parameters: {}
    transform: {kind: identity}
  - id: validation-imop4-m3
    name: imop4
    n_obj: 3
    n_var: 10
    parameters: {}
    transform: {kind: identity}
  - id: validation-imop7-m3
    name: imop7
    n_obj: 3
    n_var: 10
    parameters: {}
    transform: {kind: identity}
algorithms:
  - id: hldbea
    variant: full
    parameters:
      k: 1.0
      lambda: 0.1
      cone_epsilon: 0.0
      neighborhood_mode: axis
      score_aggregation: sum
      selection_mode: local
      objective_policy: round_robin
      tau: 1
      local_search_max_iter: 2
      local_search_acceptance: feasible_improvement
      restart: true
      restart_theta_zero: 0.95
      restart_window: 20
      restart_delta_hv: 0.0001
      restart_fraction: 0.2
      crossover_probability: 0.9
      crossover_eta: 20
      mutation_probability: inverse_n_var
      mutation_eta: 20
  - &standard
    id: nsga2
    variant: standard
    parameters: &standard_parameters
      crossover_probability: 0.9
      crossover_eta: 20
      mutation_probability: inverse_n_var
      mutation_eta: 20
  - <<: *standard
    id: spea2
  - <<: *standard
    id: nsga3
  - <<: *standard
    id: rvea
    parameters:
      <<: *standard_parameters
      alpha: 2.0
      adapt_frequency: 0.1
  - <<: *standard
    id: moead
    parameters:
      <<: *standard_parameters
      n_neighbors: 20
      prob_neighbor_mating: 0.9
  - <<: *standard
    id: sms_emoa
  - <<: *standard
    id: age_moea
  - <<: *standard
    id: maoea_hap
    variant: upstream-default
    parameters:
      <<: *standard_parameters
      crossover_probability: 1.0
  - <<: *standard
    id: fdsea
    variant: upstream-default
    parameters:
      <<: *standard_parameters
      crossover_probability: 1.0
      frequency_terms: 5
      operator: ga
execution:
  population_size: 100
  evaluation_budget: 20000
  checkpoints: [100, 1000, 5000, 10000, 20000]
  save_history: false
