problems:
  - id: validation-dtlz2-m10
    name: dtlz2
    n_obj: 10
    n_var: 19
    parameters: {}
    transform: {kind: identity}
  - id: validation-dtlz2-m15
    name: dtlz2
    n_obj: 15
