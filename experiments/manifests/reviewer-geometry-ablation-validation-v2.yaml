algorithms:
  - id: hldbea
    variant: axis-sum
    parameters: &baseline
      k: 1.0
      lambda: 0.1
      cone_epsilon: 0.0
      neighborhood_mode: axis
      score_aggregation: sum
      selection_mode: local
      objective_policy: round_robin
      tau: 1
      local_search_max_iter: 2
      local_search_acceptance: feasible_improvement
      restart: true
      restart_theta_zero: 0.95
      restart_window: 20
      restart_delta_hv: 0.0001
      restart_fraction: 0.2
      crossover_probability: 0.9
      crossover_eta: 20
      mutation_probability: inverse_n_var
      mutation_eta: 20
  - id: hldbea
    variant: selection-global
    parameters:
      <<: *baseline
      selection_mode: global
  - id: hldbea
    variant: objective-adaptive
    parameters:
      <<: *baseline
      objective_policy: adaptive
  - id: hldbea
    variant: axis-union
    parameters:
      <<: *baseline
      score_aggregation: union
  - id: hldbea
    variant: box-union
    parameters:
      <<: *baseline
      neighborhood_mode: box
      score_aggregation: union
  - id: hldbea
    variant: knn-union
    parameters:
      <<: *baseline
      neighborhood_mode: knn
      score_aggregation: union
execution:
  population_size: 100
  evaluation_budget: 20000
  checkpoints: [100, 1000, 5000, 10000, 20000]
  save_history: false
